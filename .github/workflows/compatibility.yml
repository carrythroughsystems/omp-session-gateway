name: Compatibility

# Cross-platform evidence for every change: the same checkout builds and passes its tests on each
# host OS family. This is source portability, not release qualification: exact signed releases are
# qualified separately, on the matrix in docs/COMPATIBILITY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-source:
    name: portable-source (${{ matrix.os }})
    strategy:
      # One OS failing must not cancel the others' evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Observed under 5 minutes on each runner; the bound stops a hang holding a check for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify pinned Bun
        shell: bash
        run: test "$(bun --version)" = 1.4.0
      - run: bun install --frozen-lockfile
      # Repository scan, typecheck, web build, every test not bound to another host OS
      # (scripts/test-portable.ts names each exclusion and its reason), and both leak scans.
      - run: bun run check:portable

  browser-core:
    # One Ubuntu job across engines, not an OS x browser matrix: Playwright's Chromium, Firefox, and
    # WebKit builds catch engine incompatibilities. The deep Pixel/Chromium lane
    # (browser-notifications in ci.yml) and physical device qualification stay separate.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_BROWSER_REPORT_VERSION: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify pinned Bun
        run: test "$(bun --version)" = 1.4.0
      - run: bun install --frozen-lockfile
      # Firefox and WebKit need system libraries the runner image lacks. Bound downloads before
      # installing so a slow mirror can fall back without interrupting a dpkg transaction.
      - name: Install browsers with bounded apt mirror fallback
        run: |
          set -euo pipefail
          apt_config=/etc/apt/apt.conf.d/99-omp-browser-core
          download_config=/etc/apt/apt.conf.d/99-omp-browser-core-download
          trap 'sudo rm -f "$apt_config" "$download_config"' EXIT
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' |
            sudo tee "$apt_config" >/dev/null
          printf '%s\n' 'APT::Get::Download-Only "true";' | sudo tee "$download_config" >/dev/null
          if ! sudo timeout --kill-after=10s 180s env PATH="$PATH" "$(command -v bun)" x playwright install-deps chromium firefox webkit; then
            echo "::warning::Primary apt download attempt failed; retrying once through archive.ubuntu.com"
            sudo sed -i 's/azure[.]archive[.]ubuntu[.]com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
            sudo timeout --kill-after=10s 180s env PATH="$PATH" "$(command -v bun)" x playwright install-deps chromium firefox webkit
          fi
          sudo rm "$download_config"
          bunx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      - run: bun run test:browser:compat
      - name: Summarize sanitized browser flakes
        if: ${{ always() }}
        run: bun scripts/test-browser.ts --summary-only --compat
      - name: Retain sanitized browser flakes
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-flake-browser-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-flakes/browser-flake-report.json
          retention-days: 14
          if-no-files-found: error
