name: Request OMP release

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:
    inputs:
      omp_version:
        description: Stock OMP npm version or dist-tag to request
        required: true
        default: latest
        type: string
      release_class:
        description: Gateway version transition
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor

permissions: {}

concurrency:
  group: release-request
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      omp_version: ${{ steps.resolve.outputs.omp_version }}
      lock_tag: ${{ steps.resolve.outputs.lock_tag }}
      release_class: ${{ steps.resolve.outputs.release_class }}
      class_suffix: ${{ steps.resolve.outputs.class_suffix }}
      should_request: ${{ steps.resolve.outputs.should_request }}
    steps:
      # Read only the request ref's lock; do not install or execute repository/PR code here.
      - name: Check out request lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: UPSTREAM.lock.json
          sparse-checkout-cone-mode: false
      - name: Resolve published version and enforce baseline
        id: resolve
        env:
          OMP_INPUT: ${{ github.event_name == 'schedule' && 'latest' || inputs.omp_version }}
          REQUEST_EVENT: ${{ github.event_name }}
          RELEASE_CLASS: ${{ github.event_name == 'schedule' && 'patch' || inputs.release_class }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm view "@oh-my-pi/pi-coding-agent@$OMP_INPUT" version --json >"$RUNNER_TEMP/omp-version.json"
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const strictVersion = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const version = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/omp-version.json`, "utf8"));
          if (typeof version !== "string" || !strictVersion.test(version)) {
            throw new Error("npm must resolve one strict X.Y.Z release version");
          }
          const lock = JSON.parse(fs.readFileSync("UPSTREAM.lock.json", "utf8"));
          if (typeof lock.tag !== "string" || !lock.tag.startsWith("v") || !strictVersion.test(lock.tag.slice(1))) {
            throw new Error("UPSTREAM.lock.json must name a strict vX.Y.Z baseline");
          }
          const requested = version.split(".").map(BigInt);
          const baseline = lock.tag.slice(1).split(".").map(BigInt);
          const different = requested.findIndex((part, index) => part !== baseline[index]);
          const belowBaseline = different !== -1 && requested[different] < baseline[different];
          const scheduled = process.env.REQUEST_EVENT === "schedule";
          const releaseClass = scheduled ? "patch" : process.env.RELEASE_CLASS;
          if (releaseClass !== "patch" && releaseClass !== "minor") throw new Error("release class must be patch or minor");
          if (!scheduled && belowBaseline) {
            throw new Error(`Requested v${version} is lower than lock baseline ${lock.tag}`);
          }
          let skipReason;
          if (scheduled && (different === -1 || belowBaseline)) {
            skipReason = `lock baseline ${lock.tag} already equals or exceeds latest v${version}`;
          } else if (scheduled) {
            const openRequests = execFileSync("gh", [
              "api", "--method", "GET", "--paginate", `repos/${process.env.GITHUB_REPOSITORY}/issues`,
              "-f", "state=open", "-f", "per_page=100",
              "--jq", '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and (.title | test("^Upstream tracking: v[0-9]+[.][0-9]+[.][0-9]+$"))) | .number',
            ], { encoding: "utf8" }).trim();
            if (openRequests !== "") skipReason = `open bot-authored tracking request #${openRequests.split("\n")[0]} already exists`;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `omp_version=${version}\nlock_tag=${lock.tag}\nshould_request=${skipReason === undefined}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_class=${releaseClass}\nclass_suffix=${releaseClass === "minor" ? " (minor)" : ""}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Release request resolution",
            `- Exact stock OMP: v${version}`,
            `- Dispatched lock baseline: ${lock.tag}`,
            `- Gateway release class: ${releaseClass}`,
            skipReason === undefined
              ? `- Request: ${different === -1 ? "fixes-only (equal to baseline)" : "upstream refresh"}`
              : `- Scheduled release request skipped: ${skipReason}.`,
            "",
          ].join("\n"));
          NODE

  canary:
    needs: resolve
    if: ${{ needs.resolve.outputs.should_request == 'true' }}
    # The reusable workflow also contains the schedule-only issue reporter. Its upstream-executing
    # jobs explicitly restrict their own tokens to contents:read; no upstream code can write issues.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/upstream-canary.yml
    with:
      omp_version: ${{ needs.resolve.outputs.omp_version }}

  recheck:
    name: Re-check open release requests
    needs: [resolve, canary]
    if: ${{ needs.resolve.outputs.should_request == 'true' && needs.canary.outputs.passed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      should_file: ${{ steps.recheck.outputs.should_file }}
    steps:
      - name: Re-check before filing a scheduled request
        id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          should_file=true
          if [[ "$REQUEST_EVENT" == schedule ]]; then
            # A manual request may have arrived while the exact-version canary was running.
            open_requests=$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/issues" -f state=open -f per_page=100 \
              --jq '.[] | select(.pull_request == null and .user.login == "github-actions[bot]" and (.title | test("^Upstream tracking: v[0-9]+[.][0-9]+[.][0-9]+$"))) | .number')
            if [[ -n "$open_requests" ]]; then
              should_file=false
              printf -- '- Scheduled release request skipped: open bot-authored tracking request #%s already exists after the canary.\n' "${open_requests%%$'\n'*}" >>"$GITHUB_STEP_SUMMARY"
            fi
          fi
          printf 'should_file=%s\n' "$should_file" >>"$GITHUB_OUTPUT"

  file:
    # A late scheduled skip must skip this job, not succeed and renew the driver's request identity.
    name: Request OMP v${{ needs.resolve.outputs.omp_version }}${{ needs.resolve.outputs.class_suffix }}
    needs: [resolve, canary, recheck]
    if: ${{ needs.resolve.outputs.should_request == 'true' && needs.canary.outputs.passed == 'true' && needs.recheck.outputs.should_file == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or reuse the tracking request
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_VERSION: ${{ needs.resolve.outputs.omp_version }}
          LOCK_TAG: ${{ needs.resolve.outputs.lock_tag }}
          RELEASE_CLASS: ${{ needs.resolve.outputs.release_class }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Revalidate the strings crossing into the issue-writing job.
          strict_version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ ! "$OMP_VERSION" =~ ^${strict_version}$ || ! "$LOCK_TAG" =~ ^v${strict_version}$ ]]; then
            printf 'invalid resolved request or lock baseline\n' >&2
            exit 1
          fi
          if [[ "$RELEASE_CLASS" != patch && "$RELEASE_CLASS" != minor ]]; then
            printf 'release class must be patch or minor\n' >&2
            exit 1
          fi
          title="Upstream tracking: v$OMP_VERSION"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create release-request --repo "$GITHUB_REPOSITORY" --color 0e8a16 --force >/dev/null
          minor=false
          labels=(--label release-request)
          if [[ "$RELEASE_CLASS" == minor ]]; then
            minor=true
            gh label create release-minor --repo "$GITHUB_REPOSITORY" --color 5319e7 --force >/dev/null
            labels+=(--label release-minor)
          fi
          # Pagination avoids missing an older identical open request. Only bot-authored issues
          # satisfy the Carrythrough tracking contract; pull requests and human lookalikes do not.
          matches=$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/issues" -f state=open -f per_page=100 \
            --jq ".[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and .title == \"$title\" and (any(.labels[]; .name == \"release-minor\") == $minor)) | [.number, any(.labels[]; .name == \"release-request\")] | @tsv")
          if [[ -n "$matches" ]]; then
            IFS=$'\t' read -r issue labeled <<<"${matches%%$'\n'*}"
            if [[ "$labeled" != true ]]; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label release-request >/dev/null
            fi
            issue_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$issue"
            result=reused
          else
            body=$(printf 'Requested by @%s after the exact-version canary passed.\n\nRun: %s\n\nLock baseline at the dispatched ref: %s.\n\nGateway release class: %s.\n' "$REQUEST_ACTOR" "$run_url" "$LOCK_TAG" "$RELEASE_CLASS")
            issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" "${labels[@]}" --title "$title" --body "$body")
            result=created
          fi
          # Reusing a request never posts a comment or rewrites its human note.
          {
            printf '## Release request\n'
            printf -- '- Exact stock OMP: v%s\n' "$OMP_VERSION"
            printf -- '- Lock baseline: %s\n' "$LOCK_TAG"
            printf -- '- Gateway release class: %s\n' "$RELEASE_CLASS"
            printf -- '- Canary: passed on Linux and Windows\n'
            printf -- '- Tracking issue (%s): %s\n' "$result" "$issue_url"
            printf -- '- Requested by: @%s\n' "$REQUEST_ACTOR"
          } >>"$GITHUB_STEP_SUMMARY"
