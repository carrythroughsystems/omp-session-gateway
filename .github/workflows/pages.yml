name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/logo.svg
      - assets/og.png
      - apps/web/src/favicon.svg
      - docs/media/01-all-clear.png
      - docs/media/02-needs-you.png
      - docs/media/03-open-request.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The site carries no copies of brand or media assets; stage each from its canonical source
      # so a brand or capture refresh cannot leave the site stale. Keep this list in step with
      # STAGED_SITE_ASSETS in scripts/site-coherence.test.ts and the site/ block in .gitignore.
      - name: Stage canonical brand and media assets
        run: |
          cp assets/logo.svg assets/og.png apps/web/src/favicon.svg site/
          cp docs/media/01-all-clear.png site/screen-all-clear.png
          cp docs/media/02-needs-you.png site/screen-needs-you.png
          cp docs/media/03-open-request.png site/screen-open-request.png
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
