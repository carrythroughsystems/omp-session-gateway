name: Upstream OMP canary

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      omp_version:
        description: Stock OMP npm version to exercise
        required: true
        default: latest
        type: string
  workflow_call:
    inputs:
      omp_version:
        description: Exact stock OMP npm version to exercise
        required: true
        type: string
    outputs:
      passed:
        description: Linux and Windows passed for the exact requested OMP version
        value: ${{ jobs.result.outputs.passed }}
  pull_request:
    paths:
      - scripts/upstream-canary.ts
      - scripts/upstream-canary.test.ts
      - scripts/client-drift.ts
      - scripts/client-drift.test.ts
      - scripts/upstream-pins.ts
      - scripts/upstream-pins.test.ts
      - packages/collab-client/upstream/UPSTREAM.json
      - UPSTREAM.lock.json
      - .github/workflows/upstream-canary.yml
      - scripts/omp-fixture.*
      - apps/gateway/src/omp-registry.ts

permissions:
  contents: read

concurrency:
  group: upstream-canary-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Two jobs rather than an OS matrix: a matrix job exposes only its last leg's outputs, and the
# failure report needs each host's version and failed stage.
jobs:
  inspect-client-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      issue_action: ${{ steps.inspect.outputs.issue_action }}
    steps:
      - name: Check out gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Inspect embedded source against npm latest
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.4
          bun scripts/client-drift.ts >"$RUNNER_TEMP/client-drift-report.json"
      - name: Retain complete source drift report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-drift-report
          path: ${{ runner.temp }}/client-drift-report.json
          if-no-files-found: error
          retention-days: 14

  report-client-drift:
    # Only daily/manual observations on main may write. Reusable release requests stay observation-only.
    if: ${{ needs.inspect-client-drift.result == 'success' && github.workflow == 'Upstream OMP canary' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: inspect-client-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: embedded-client-drift-writer
      cancel-in-progress: false
    steps:
      # No checkout, dependency installation, repository imports, or upstream execution.
      - name: Apply the inspected issue action
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_ACTION: ${{ needs.inspect-client-drift.outputs.issue_action }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const action = JSON.parse(process.env.ISSUE_ACTION);
          if (action.kind === "none") {
            console.log("No relevant embedded client source drift; existing issues left unchanged.");
          } else {
            // Revalidate inert data across the read/write boundary. Never evaluate report strings.
            const title = /^Embedded client drift: v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*) → v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (!["create", "update"].includes(action.kind) || !title.test(action.title)
              || action.label !== "client-drift" || !/^[0-9a-f]{40}$/.test(action.releaseCommit)
              || action.marker !== `<!-- embedded-client-drift:${action.releaseCommit} -->`
              || typeof action.body !== "string" || !action.body.startsWith(action.marker + "\n")
              || Buffer.byteLength(action.body) > 60000
              || (action.kind === "create" ? action.issueNumber !== null
                : !Number.isSafeInteger(action.issueNumber) || action.issueNumber <= 0)) {
              throw new Error("Invalid inspected client drift issue action");
            }
            const repo = process.env.GITHUB_REPOSITORY;
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo)) throw new Error("Invalid issue repository");
            const gh = args => execFileSync("gh", args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
            // A serialized writer refuses stale plans, rather than duplicating a concurrent observation
            // or reopening/reclassifying an issue edited since inspection. The next run observes it.
            const pages = JSON.parse(gh(["api", "--method", "GET", "--paginate", "--slurp",
              `repos/${repo}/issues`, "-f", "state=open", "-f", "per_page=100"]));
            if (!Array.isArray(pages) || pages.some(page => !Array.isArray(page))) throw new Error("Invalid issue pages");
            const matching = pages.flat().filter(issue => issue.state === "open" && !issue.pull_request
              && /^Embedded client drift: v[0-9]+\.[0-9]+\.[0-9]+ → v[0-9]+\.[0-9]+\.[0-9]+$/.test(issue.title)
              && Array.isArray(issue.labels) && issue.labels.some(label => label.name === action.label)
              && !issue.labels.some(label => ["release-request", "release-minor"].includes(label.name))
              && (issue.title === action.title || typeof issue.body === "string" && issue.body.includes(action.marker)));
            if (action.kind === "create" ? matching.length !== 0
              : !matching.some(issue => issue.number === action.issueNumber)) {
              throw new Error("Client drift issue plan became stale; rerun read-only inspection");
            }
            gh(["label", "create", action.label, "--repo", repo, "--color", "5319e7", "--force"]);
            if (action.kind === "create") {
              gh(["issue", "create", "--repo", repo, "--label", action.label, "--title", action.title, "--body", action.body]);
            } else {
              gh(["issue", "edit", String(action.issueNumber), "--repo", repo, "--title", action.title, "--body", action.body]);
            }
            console.log(`Applied embedded client drift issue action: ${action.kind}`);
          }
          NODE

  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      omp_version: ${{ steps.summary.outputs.omp_version }}
      failed_stage: ${{ steps.summary.outputs.failed_stage }}
      requested_version: ${{ steps.install.outputs.requested_version }}
      resolved_version: ${{ steps.install.outputs.omp_version }}
      bun_version: ${{ steps.install.outputs.bun_version }}
      bun_engine: ${{ steps.install.outputs.bun_engine }}
      passed: ${{ steps.summary.outcome == 'success' && steps.summary.outputs.failed_stage == '' && steps.install.outputs.expected_version != '' && steps.summary.outputs.omp_version == steps.install.outputs.expected_version }}
    env:
      OMP_VERSION: ${{ inputs.omp_version || 'latest' }}
    steps:
      - name: Check out gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Verify pinned Bun
        run: test "$(bun --version)" = 1.4.4
      - run: bun install --frozen-lockfile
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
      - name: Ensure tmux is available
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y tmux
          fi
      - name: Install isolated stock OMP
        id: install
        env:
          OMP_PACKAGE: ${{ runner.temp }}/omp-upstream-package
        run: |
          set -euo pipefail
          if [[ ! "$OMP_VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'prepare: invalid OMP version input\n' >&2
            exit 1
          fi
          printf 'requested_version=%s\nbun_version=%s\n' "$OMP_VERSION" "$(bun --version)" >>"$GITHUB_OUTPUT"
          mkdir -m 700 "$OMP_PACKAGE"
          cd "$OMP_PACKAGE"
          printf '{"private":true}\n' >package.json
          if ! bun add --exact "@oh-my-pi/pi-coding-agent@$OMP_VERSION" </dev/null >/dev/null 2>&1; then
            printf 'prepare: OMP installation failed\n' >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2016 # the single-quoted argument is JavaScript for bun, not shell
          bun --eval '
            import { appendFile } from "node:fs/promises";
            import { readCanaryPackage, canaryBunEngineError } from "./scripts/upstream-canary.ts";
            const installed = await readCanaryPackage(`${process.env.OMP_PACKAGE}/node_modules/@oh-my-pi/pi-coding-agent`);
            const expectedVersion = process.env.OMP_VERSION === "latest" ? installed.ompVersion : process.env.OMP_VERSION;
            await appendFile(process.env.GITHUB_OUTPUT, `omp_version=${installed.ompVersion}\nbun_engine=${installed.bunEngine}\nexpected_version=${expectedVersion}\n`);
            const error = canaryBunEngineError(installed, Bun.version);
            if (error !== undefined) {
              process.stderr.write(`prepare: ${error}\n`);
              process.exitCode = 1;
            }
          '
      - name: Exercise gateway compatibility
        env:
          OMP_PACKAGE: ${{ runner.temp }}/omp-upstream-package
          CANARY_REPORT: ${{ runner.temp }}/upstream-canary.json
        run: |
          set -euo pipefail
          bun scripts/upstream-canary.ts --omp "$OMP_PACKAGE/node_modules/@oh-my-pi/pi-coding-agent/dist/cli.js" </dev/null >"$CANARY_REPORT"
      - name: Publish bounded summary
        id: summary
        if: always()
        env:
          CANARY_REPORT: ${{ runner.temp }}/upstream-canary.json
          REQUESTED_OMP_VERSION: ${{ steps.install.outputs.requested_version }}
          RESOLVED_OMP_VERSION: ${{ steps.install.outputs.omp_version }}
          BUN_VERSION: ${{ steps.install.outputs.bun_version }}
          OMP_BUN_ENGINE: ${{ steps.install.outputs.bun_engine }}
        run: |
          # shellcheck disable=SC2016 # the single-quoted argument is JavaScript for bun, not shell
          bun --eval '
            import { appendFile } from "node:fs/promises";
            import { CANARY_STAGES, canarySummary, parseCanarySummary, parseOmpVersion } from "./scripts/upstream-canary.ts";
            const resolvedVersion = parseOmpVersion(process.env.RESOLVED_OMP_VERSION ?? "") ?? "";
            let summary;
            try {
              summary = parseCanarySummary(await Bun.file(process.env.CANARY_REPORT).text(), "posix", resolvedVersion);
            } catch {
              summary = canarySummary(resolvedVersion, 0, "prepare", false, "posix");
              process.exitCode = 1;
            }
            const passed = summary.failedStage === undefined;
            const lines = [
              `requestedOmpVersion: ${process.env.REQUESTED_OMP_VERSION || "unknown"}`,
              `resolvedOmpVersion: ${resolvedVersion || "unknown"}`,
              `bunVersion: ${process.env.BUN_VERSION || "unknown"}`,
              `bunEngine: ${process.env.OMP_BUN_ENGINE || "unknown"}`,
              `ompVersion: ${summary.ompVersion}`,
              `platform: ${summary.platform}`,
              `passed: ${passed}`,
              `discoveryFileRemoved: ${summary.discoveryFileRemoved}`,
              `durationMs: ${summary.durationMs}`,
              ...CANARY_STAGES.map(stage => `${stage}: ${summary.stages[stage]}`),
            ];
            await appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
            await appendFile(process.env.GITHUB_OUTPUT, `omp_version=${summary.ompVersion}\nfailed_stage=${summary.failedStage ?? ""}\n`);
            process.stdout.write(`${JSON.stringify(summary)}\n`);
          '

  # Windows uses its own hidden console and named pipe. It proves saved-session continuation;
  # the three tmux-driven transitions are explicitly skipped in its strict platform projection.
  canary-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      omp_version: ${{ steps.summary.outputs.omp_version }}
      failed_stage: ${{ steps.summary.outputs.failed_stage }}
      requested_version: ${{ steps.install.outputs.requested_version }}
      resolved_version: ${{ steps.install.outputs.omp_version }}
      bun_version: ${{ steps.install.outputs.bun_version }}
      bun_engine: ${{ steps.install.outputs.bun_engine }}
      passed: ${{ steps.summary.outcome == 'success' && steps.summary.outputs.failed_stage == '' && steps.install.outputs.expected_version != '' && steps.summary.outputs.omp_version == steps.install.outputs.expected_version }}
    env:
      OMP_VERSION: ${{ inputs.omp_version || 'latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Verify pinned Bun
        run: test "$(bun --version)" = 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install isolated stock OMP
        id: install
        env:
          OMP_PACKAGE: ${{ runner.temp }}/omp-upstream-package
        run: |
          set -euo pipefail
          if [[ ! "$OMP_VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            printf 'prepare: invalid OMP version input\n' >&2
            exit 1
          fi
          printf 'requested_version=%s\nbun_version=%s\n' "$OMP_VERSION" "$(bun --version)" >>"$GITHUB_OUTPUT"
          mkdir "$OMP_PACKAGE"
          cd "$OMP_PACKAGE"
          printf '{"private":true}\n' >package.json
          if ! bun add --exact "@oh-my-pi/pi-coding-agent@$OMP_VERSION" </dev/null >/dev/null 2>&1; then
            printf 'prepare: OMP installation failed\n' >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2016 # the single-quoted argument is JavaScript for bun, not shell
          bun --eval '
            import { appendFile } from "node:fs/promises";
            import { readCanaryPackage, canaryBunEngineError } from "./scripts/upstream-canary.ts";
            const installed = await readCanaryPackage(`${process.env.OMP_PACKAGE}/node_modules/@oh-my-pi/pi-coding-agent`);
            const expectedVersion = process.env.OMP_VERSION === "latest" ? installed.ompVersion : process.env.OMP_VERSION;
            await appendFile(process.env.GITHUB_OUTPUT, `omp_version=${installed.ompVersion}\nbun_engine=${installed.bunEngine}\nexpected_version=${expectedVersion}\n`);
            const error = canaryBunEngineError(installed, Bun.version);
            if (error !== undefined) {
              process.stderr.write(`prepare: ${error}\n`);
              process.exitCode = 1;
            }
          '
      - name: Exercise gateway compatibility
        env:
          OMP_PACKAGE: ${{ runner.temp }}/omp-upstream-package
          CANARY_REPORT: ${{ runner.temp }}/upstream-canary.json
        run: |
          set -euo pipefail
          bun scripts/upstream-canary.ts --omp "$OMP_PACKAGE/node_modules/@oh-my-pi/pi-coding-agent/dist/cli.js" </dev/null >"$CANARY_REPORT"
      - name: Publish bounded summary
        id: summary
        if: always()
        env:
          CANARY_REPORT: ${{ runner.temp }}/upstream-canary.json
          REQUESTED_OMP_VERSION: ${{ steps.install.outputs.requested_version }}
          RESOLVED_OMP_VERSION: ${{ steps.install.outputs.omp_version }}
          BUN_VERSION: ${{ steps.install.outputs.bun_version }}
          OMP_BUN_ENGINE: ${{ steps.install.outputs.bun_engine }}
        run: |
          # shellcheck disable=SC2016 # the single-quoted argument is JavaScript for bun, not shell
          bun --eval '
            import { appendFile } from "node:fs/promises";
            import { CANARY_STAGES, canarySummary, parseCanarySummary, parseOmpVersion } from "./scripts/upstream-canary.ts";
            const resolvedVersion = parseOmpVersion(process.env.RESOLVED_OMP_VERSION ?? "") ?? "";
            let summary;
            try {
              summary = parseCanarySummary(await Bun.file(process.env.CANARY_REPORT).text(), "windows", resolvedVersion);
            } catch {
              summary = canarySummary(resolvedVersion, 0, "prepare", false, "windows");
              process.exitCode = 1;
            }
            const passed = summary.failedStage === undefined;
            const lines = [
              `requestedOmpVersion: ${process.env.REQUESTED_OMP_VERSION || "unknown"}`,
              `resolvedOmpVersion: ${resolvedVersion || "unknown"}`,
              `bunVersion: ${process.env.BUN_VERSION || "unknown"}`,
              `bunEngine: ${process.env.OMP_BUN_ENGINE || "unknown"}`,
              `ompVersion: ${summary.ompVersion}`,
              `platform: ${summary.platform}`,
              `passed: ${passed}`,
              `discoveryFileRemoved: ${summary.discoveryFileRemoved}`,
              `durationMs: ${summary.durationMs}`,
              ...CANARY_STAGES.map(stage => `${stage}: ${summary.stages[stage]}`),
            ];
            await appendFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
            await appendFile(process.env.GITHUB_OUTPUT, `omp_version=${summary.ompVersion}\nfailed_stage=${summary.failedStage ?? ""}\n`);
            process.stdout.write(`${JSON.stringify(summary)}\n`);
          '

  result:
    if: ${{ always() }}
    needs: [canary, canary-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Expose exact-version canary result
        id: result
        env:
          PASSED: ${{ needs.canary.result == 'success' && needs.canary-windows.result == 'success' && needs.canary.outputs.passed == 'true' && needs.canary-windows.outputs.passed == 'true' }}
        run: printf 'passed=%s\n' "$PASSED" >>"$GITHUB_OUTPUT"

  report-failure:
    # The code that installs/runs upstream never receives an issue-writing token; PRs cannot enter here.
    if: ${{ always() && github.event_name == 'schedule' && (needs.canary.result == 'failure' || needs.canary-windows.result == 'failure') }}
    needs: [canary, canary-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: Open or update the upstream canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RESULT: ${{ needs.canary.result }}
          LINUX_VERSION: ${{ needs.canary.outputs.omp_version }}
          LINUX_REQUESTED_VERSION: ${{ needs.canary.outputs.requested_version }}
          LINUX_RESOLVED_VERSION: ${{ needs.canary.outputs.resolved_version }}
          LINUX_BUN_VERSION: ${{ needs.canary.outputs.bun_version }}
          LINUX_BUN_ENGINE: ${{ needs.canary.outputs.bun_engine }}
          LINUX_STAGE: ${{ needs.canary.outputs.failed_stage }}
          WINDOWS_RESULT: ${{ needs.canary-windows.result }}
          WINDOWS_VERSION: ${{ needs.canary-windows.outputs.omp_version }}
          WINDOWS_REQUESTED_VERSION: ${{ needs.canary-windows.outputs.requested_version }}
          WINDOWS_RESOLVED_VERSION: ${{ needs.canary-windows.outputs.resolved_version }}
          WINDOWS_BUN_VERSION: ${{ needs.canary-windows.outputs.bun_version }}
          WINDOWS_BUN_ENGINE: ${{ needs.canary-windows.outputs.bun_engine }}
          WINDOWS_STAGE: ${{ needs.canary-windows.outputs.failed_stage }}
        run: |
          set -euo pipefail
          # Validate again across the job/permission boundary. Never copy raw reports into an issue.
          version() { if [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then printf '%s' "$1"; else printf unknown; fi; }
          requested() { if [[ "$1" == latest ]]; then printf latest; else version "$1"; fi; }
          engine() { if [[ "$1" =~ ^[0-9A-Za-z.*+~^\<\>=\|\ -]{1,160}$ ]]; then printf '%s' "$1"; else printf unknown; fi; }
          stage() { case "$1" in prepare|publish|snapshot|stale-generation|view|control|new-generation|fork|branch-rewind|continue|unregister) printf '%s' "$1" ;; *) printf prepare ;; esac; }
          failures=()
          context=()
          if [[ "$LINUX_RESULT" == failure ]]; then
            failures+=("$(version "${LINUX_VERSION:-$LINUX_RESOLVED_VERSION}") failed at $(stage "$LINUX_STAGE") on Linux")
            context+=("Linux: requested OMP $(requested "$LINUX_REQUESTED_VERSION"), resolved OMP $(version "$LINUX_RESOLVED_VERSION"), running Bun $(version "$LINUX_BUN_VERSION"); OMP requires Bun $(engine "$LINUX_BUN_ENGINE").")
          fi
          if [[ "$WINDOWS_RESULT" == failure ]]; then
            failures+=("$(version "${WINDOWS_VERSION:-$WINDOWS_RESOLVED_VERSION}") failed at $(stage "$WINDOWS_STAGE") on Windows")
            context+=("Windows: requested OMP $(requested "$WINDOWS_REQUESTED_VERSION"), resolved OMP $(version "$WINDOWS_RESOLVED_VERSION"), running Bun $(version "$WINDOWS_BUN_VERSION"); OMP requires Bun $(engine "$WINDOWS_BUN_ENGINE").")
          fi
          title="Upstream OMP canary: ${failures[0]}"
          if (( ${#failures[@]} > 1 )); then title="$title (and Windows)"; fi
          body="$(printf '%s. ' "${failures[@]}")$(printf '\n%s' "${context[@]}")"$'\n'"Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create upstream-canary --repo "$GITHUB_REPOSITORY" --color d73a4a --force >/dev/null
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-canary --state all --limit 1 --json number --jq '.[0].number // empty')
          if [[ -n "$issue" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f state=open -f title="$title" --silent
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body" >/dev/null
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label upstream-canary --title "$title" --body "$body" >/dev/null
          fi
