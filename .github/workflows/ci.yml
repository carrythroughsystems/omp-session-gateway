name: CI
run-name: >-
  CI / ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'github-hosted' }} /
  ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution pool; gateway-ci is for trusted manual runs only
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - gateway-ci
      dispatch_id:
        description: Optional controller correlation identifier
        required: false
        default: manual
        type: string
      routing_label:
        description: Controller-supplied one-time label; leave blank in the GitHub UI
        required: false
        type: string
      target_sha:
        description: Exact commit tested by a trusted fleet dispatch
        required: false
        type: string
      playwright_workers:
        description: Playwright workers for the browser suite; 2 is the qualified default, 3 is UNQUALIFIED pending a benchmark campaign, and 4 was REJECTED for missing the 900 ms gateway recovery bound.
        required: false
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

jobs:
  implementation-checks:
    # Pushes and pull requests always resolve to GitHub-hosted. A trusted controller must supply
    # the unpredictable one-time label shared by the ephemeral runners it registers for this
    # invocation. The jobs here are independent, so a parallel self-hosted run needs one free
    # runner per job.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' && inputs.routing_label || 'ubuntu-24.04' }}
    # Observed ~20s. A bound keeps a hung step from holding a required check for the 6h default.
    timeout-minutes: 15
    steps:
      - name: Validate bounded gateway dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' }}
        env:
          ROUTING_LABEL: ${{ inputs.routing_label }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          fail() {
            printf 'invalid gateway fleet dispatch: %s\n' "$1" >&2
            exit 2
          }
          [[ "$ROUTING_LABEL" =~ ^gateway-ci-linux-x64-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || fail routing_label
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || fail target_sha
          [[ "$RUNNER_NAME" =~ ^gateway-ci-(nyc|sf)-[1-3]$ ]] || fail runner_name
          [[ ! -S /var/run/docker.sock ]] || fail docker_socket
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' && inputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      # GitHub rejects a workflow with an invalid expression context without ever starting it, so a
      # broken workflow merges as a silent no-op; the upstream canary did exactly that.
      - name: Lint workflows
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "the pinned actionlint build is linux x86-64 only" >&2; exit 1; }
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify pinned Bun
        run: test "$(bun --version)" = 1.4.0
      - run: bun install --frozen-lockfile
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
      - run: bun run check

  coverage:
    # Its own job rather than a second run inside implementation-checks: a coverage or upload
    # problem can never turn the required gate red, and the seconds it costs overlap that job
    # instead of extending it.
    # Same one-time-label invariant as implementation-checks.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' && inputs.routing_label || 'ubuntu-24.04' }}
    # Observed ~20s of tests plus the upload round trip; same bound as implementation-checks.
    timeout-minutes: 15
    env:
      # Referenced by the upload step's `if`, which cannot read `secrets` directly. Explicitly blank
      # on fleet jobs so code from an exact target SHA receives no repository secret.
      CODECOV_TOKEN: ${{ (github.event_name != 'workflow_dispatch' || inputs.runner != 'gateway-ci') && secrets.CODECOV_TOKEN || '' }}
    steps:
      - name: Validate bounded gateway dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' }}
        env:
          ROUTING_LABEL: ${{ inputs.routing_label }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          fail() {
            printf 'invalid gateway fleet dispatch: %s\n' "$1" >&2
            exit 2
          }
          [[ "$ROUTING_LABEL" =~ ^gateway-ci-linux-x64-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || fail routing_label
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || fail target_sha
          [[ "$RUNNER_NAME" =~ ^gateway-ci-(nyc|sf)-[1-3]$ ]] || fail runner_name
          [[ ! -S /var/run/docker.sock ]] || fail docker_socket
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' && inputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify pinned Bun
        run: test "$(bun --version)" = 1.4.0
      - run: bun install --frozen-lockfile
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
      - run: bun run test:coverage
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          # Coverage reporting must not gate a merge on a third-party service being reachable. A
          # failed upload shows up as a stale Codecov status on the pull request instead.
          fail_ci_if_error: false

  browser-notifications:
    # Same one-time-label invariant as implementation-checks: automatic and concurrently
    # queued jobs cannot select this invocation's runners.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' && inputs.routing_label || 'ubuntu-24.04' }}
    # Observed 2-7 min. On 2026-08-19 an Ubuntu mirror stall inside `playwright install --with-deps`
    # hung this job for 38 minutes with no output before it was cancelled by hand.
    timeout-minutes: 20
    env:
      # Two workers is the qualified default for automatic and manual runs. A manual dispatch can
      # still select 1, 3, or 4 for a bounded benchmark. 3 is UNQUALIFIED pending a
      # benchmark campaign, and 4 was REJECTED for missing the 900 ms gateway recovery bound.
      PLAYWRIGHT_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.playwright_workers || '2' }}
    steps:
      - name: Validate bounded gateway dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' }}
        env:
          ROUTING_LABEL: ${{ inputs.routing_label }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          fail() {
            printf 'invalid gateway fleet dispatch: %s\n' "$1" >&2
            exit 2
          }
          [[ "$ROUTING_LABEL" =~ ^gateway-ci-linux-x64-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || fail routing_label
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || fail target_sha
          [[ "$RUNNER_NAME" =~ ^gateway-ci-(nyc|sf)-[1-3]$ ]] || fail runner_name
          [[ ! -S /var/run/docker.sock ]] || fail docker_socket
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' && inputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'gateway-ci' && startsWith(inputs.routing_label, 'gateway-ci-linux-x64-') && inputs.target_sha != '' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify pinned Bun
        run: test "$(bun --version)" = 1.4.0
      - run: bun install --frozen-lockfile
      # No --with-deps: the ubuntu-24.04 runner image already ships Chromium's shared libraries, and
      # apt was the only network dependency in this job. On 2026-08-19 an Ubuntu mirror stalled here
      # twice, once for 38 minutes before the job was cancelled by hand and once until the bound
      # below fired, both times immediately after `Get:5 noble-security InRelease`. If a library is
      # ever genuinely missing, `bun run test:browser` fails loudly on browser launch.
      - run: bunx playwright install chromium
        if: ${{ runner.environment == 'github-hosted' }}
        timeout-minutes: 10
      - run: bun run test:browser
