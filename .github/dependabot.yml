version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The collaboration client is copied from the exact OMP source pinned in its provenance
      # manifest. Move these only as part of an explicit upstream-client refresh.
      - dependency-name: "@oh-my-pi/pi-wire"
      - dependency-name: katex
      - dependency-name: lucide-react

      - dependency-name: react
      - dependency-name: react-dom
      # Keep the type surface aligned with the packageManager/CI Bun runtime.
      - dependency-name: "@types/bun"
      # Canonical media records the exact capture tool and browser; move this only when recapturing.
      - dependency-name: "@playwright/test"
      # Visual baselines and serializer/security contracts move with reviewed capture-tool bumps.
      - dependency-name: "@percy/cli"
      - dependency-name: "@percy/playwright"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
