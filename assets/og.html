<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OMP Session Gateway — social preview</title>
<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url("../apps/web/src/fonts/geist/geist-latin.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url("../apps/web/src/fonts/geist/geist-mono-latin.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; font-family: "Geist", system-ui, sans-serif; font-feature-settings: "ss08"; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1280px; height: 640px; overflow: hidden; padding: 72px 80px; background: #000; color: #f5f5f3; }
  /* The mark at architectural scale: the doorway the page is, with one live session in it. */
  .portal { position: absolute; right: -40px; bottom: -150px; color: #1c1c1f; }
  .lockup { position: relative; display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 640; letter-spacing: -0.025em; }
  .license { margin-left: auto; color: #8e8e95; font-family: "Geist Mono", monospace; font-size: 17px; font-weight: 400; letter-spacing: -0.01em; }
  .promise { position: relative; margin-top: 118px; max-width: 800px; font-size: 68px; font-weight: 680; line-height: 1.04; letter-spacing: -0.045em; }
  .promise span { color: #8e8e95; }
  .footer {
    position: absolute; left: 80px; bottom: 64px;
    color: #8e8e95; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="card">
  <svg class="portal" width="620" height="620" viewBox="0 0 96 96" aria-hidden="true">
    <path d="M25 80V47a23 23 0 0 1 46 0v33" fill="none" stroke="currentColor" stroke-width="12"/>
    <circle cx="48" cy="63" r="9" fill="#30D67C"/>
  </svg>
  <div class="lockup">
    <svg width="40" height="40" viewBox="0 0 96 96" aria-hidden="true">
      <path d="M25 80V47a23 23 0 0 1 46 0v33" fill="none" stroke="#F5F5F3" stroke-width="12"/>
      <circle cx="48" cy="63" r="9" fill="#30D67C"/>
    </svg>
    <span>OMP Session Gateway</span>
    <span class="license">MIT &middot; community project</span>
  </div>
  <p class="promise">Every live OMP session.<br><span>One private page, in any modern browser.</span></p>
  <div class="footer">github.com/carrythroughsystems/omp-session-gateway</div>
</div>
</body>
</html>
