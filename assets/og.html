<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OMP Session Gateway — social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060809; font-family: 'Space Grotesk', system-ui, sans-serif; }
  .card {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    background: #060809;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.5;
    background-image:
      linear-gradient(rgba(232,236,239,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,236,239,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .glow {
    position: absolute; left: 50%; top: 42%; width: 820px; height: 440px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(49,196,141,0.10) 0%, transparent 65%);
  }
  .mark { position: relative; display: block; }
  .title { position: relative; color: #E8ECEF; font-size: 64px; font-weight: 600; letter-spacing: -0.015em; line-height: 1; }
  .promise {
    position: relative; color: #B6BEC7; font-size: 26px; font-weight: 500; line-height: 1.45;
    text-align: center;
  }
  .footer {
    position: absolute; left: 48px; right: 48px; bottom: 36px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.06em; color: #5F6870;
  }
  .repo { display: flex; align-items: center; gap: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #31C48D; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>
  <svg class="mark" width="88" height="88" viewBox="0 0 96 96" aria-hidden="true">
    <rect x="12" y="16" width="72" height="10" rx="2" fill="#E8ECEF"/>
    <rect x="24" y="26" width="10" height="52" rx="2" fill="#E8ECEF"/>
    <rect x="62" y="26" width="10" height="52" rx="2" fill="#E8ECEF"/>
    <circle cx="48" cy="58" r="8" fill="#31C48D"/>
  </svg>
  <div class="title">OMP Session Gateway</div>
  <p class="promise">Every live OMP session.<br>One private page, in any modern browser.</p>
  <div class="footer">
    <span class="repo"><span class="dot"></span><span>github.com/carrythroughsystems/omp-session-gateway</span></span>
    <span>MIT &middot; community project</span>
  </div>
</div>
</body>
</html>
